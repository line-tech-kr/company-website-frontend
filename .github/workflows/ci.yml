name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: i18n parity
        run: pnpm i18n:check

      - name: Verify cert slugs
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: 9ped5k0o
          NEXT_PUBLIC_SANITY_DATASET: production
        run: pnpm certs:verify

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: vitest-coverage
          path: coverage/
          retention-days: 7

      - name: Build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: 9ped5k0o
          NEXT_PUBLIC_SANITY_DATASET: production
        run: pnpm build

  e2e:
    name: E2E Tests
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # NEXT_PUBLIC_* vars used in client components must be in .env files —
      # webpack inlines them at compile time, not from process.env.
      # CAPTCHA_DEV_BYPASS=1 lets verifyTurnstile pass without a real
      # TURNSTILE_SECRET_KEY in CI; without it the server fails closed.
      - name: Write .env.local for E2E
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_SANITY_PROJECT_ID=9ped5k0o
          NEXT_PUBLIC_SANITY_DATASET=production
          NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
          CAPTCHA_DEV_BYPASS=1
          EOF

      - name: Run E2E tests
        run: pnpm e2e --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
